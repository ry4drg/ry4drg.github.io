    <!-- Fullscreen image overlay styles (mobile OnlyFans behavior) -->
    <style>
      #fullscreenOverlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;       /* fallback */
        height: 100dvh;      /* dynamic viewport height (better on mobile) */
        background: #000;
        z-index: 99999;
        overflow: hidden;
      }
      #fullscreenOverlay img {
        width: 100%;

        display: block;
      }
      #closeOverlay {
        position: fixed;

<script data-goatcounter="https://ry4drg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<body>
    <div class="container">

          <main>

            <!--
              By default, the Avatar is rounded. Use the following:

            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5qB9VYGzgNL28TxTzbhLbo?utm_source=generator&si=7ec064866b9f4cf3" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

            <!-- Add a short description about yourself or your brand -->
            <p></p>

            <!-- All your buttons go here -->

              <!-- OnlyFans (opens fullscreen overlay on mobile only) -->
              <a class="button button-onlyfans" id="onlyfansBtn" href="https://i.pinimg.com/1200x/b1/01/34/b1013489984bfe8f549c936768121cf2.jpg" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/onlyfans.svg" alt="OnlyFans Logo">OnlyFans (18+)</a>

              <!-- Ngl -->
              <a class="button button-ngl" href="https://ngl.link/ry4drg" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/ngl.svg" alt="Ngl Logo">NGL</a>

              <!-- Snapchat -->

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your Links and stuff fork is set up -->
      <footer>

  </div>

  <!-- Fullscreen overlay used by the OnlyFans button on mobile -->
  <div id="fullscreenOverlay" aria-hidden="true">
    <img id="fullscreenImage" src="" alt="OnlyFans content">
    <button id="closeOverlay" aria-label="Close">&times;</button>
  </div>

  <script>
  (function () {
    var btn      = document.getElementById('onlyfansBtn');
    var overlay  = document.getElementById('fullscreenOverlay');
    var img      = document.getElementById('fullscreenImage');
    var closeBtn = document.getElementById('closeOverlay');

    // Mobile detection (also true on iPad etc.)
    var isMobile = /Mobi|Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    btn.addEventListener('click', function (e) {
      if (!isMobile) return; // desktop: keep default new-tab behavior

      e.preventDefault();
      img.src = btn.href;
      overlay.style.display = 'block';
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    });

    function closeOverlay() {
      overlay.style.display = 'none';
      overlay.setAttribute('aria-hidden', 'true');
      img.src = '';
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeOverlay);

    // Tap the black area (outside the image) to close
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeOverlay();
    });

    // Escape key closes
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.style.display === 'block') {
        closeOverlay();
      }
    });
  })();
  </script>

</body>

</html>
